name: Deploy to GitHub Pages

# One workflow, one gate. This lab used to split them: ci.yml ran npm ci, the
# vitest unit tests and the build on pull_request, and deploy.yml ran that same
# sequence PLUS the browser gate -- the Playwright chromium install and the
# axe-core WCAG A/AA scan -- on push to main. Dependabot's auto-merge
# hung off ci.yml, the lighter of the two. So a bump only had to satisfy the unit
# tests and the build to merge itself, and the accessibility gate then judged it
# for the first time on the merge commit, where failing blocks the deploy instead
# of blocking the merge. Nothing goes red in between: the PR is green, the merge
# is clean, and main quietly stops shipping. Staleness is not a state anything
# reports.
#
# crypto-lab-e91 drifted exactly that way and was found serving a build older
# than its main: a grouped minor bump floated a deliberately pinned
# @playwright/test version back up, past a gate that could not see what the pin
# was holding down.
#
# So the gate a bump merges against is now literally the gate the deploy runs --
# one `build` job, depended on by both `deploy` and `dependabot-auto-merge`.
# ci.yml is deleted rather than kept beside it: a second copy of a gate is how
# the two drifted apart in the first place.
on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait on.
  # `branches: [main]` is copied from the ci.yml this replaces, so the set of
  # pull requests that get gated is unchanged.
  pull_request:
    branches: [main]
  # Required by the post-merge dispatch at the bottom of this file.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`. Now that pull_request is a trigger and
  # cancel-in-progress is on, a bare group would let a PR run cancel a live main
  # deploy -- and `cancelled` is one of the shapes that ships nothing while
  # looking like nothing went wrong.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # A pull request is gated, never published. `!= 'pull_request'` and NOT an
    # equality test against push: the two read as equivalent, but matching push
    # alone also skips workflow_dispatch, which is the one trigger the post-merge
    # dispatch below depends on -- the dispatched run would build, pass the gate,
    # skip this job, and leave the site exactly as stale as it was. f532336 fixed
    # precisely that here once already; do not let it come back.
    #
    # Note this is safe to gate only because build and deploy are separate jobs.
    # Where they are one job, gating it off for pull requests disables the PR
    # gate itself, so the PR runs nothing and reports nothing.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument, and it is the
  # SAME build job `deploy` needs -- so a bump cannot merge unless the thing that
  # would later block the deploy has already gone green on the PR. It used to
  # need ci.yml's `test` job, which ran a strict prefix of this one and could not
  # see the accessibility gate at all.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch below; without it, it 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build and the axe WCAG scan --
      # judges a bump far better than its version number does. A major that
      # actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
      # them so workflows cannot retrigger themselves -- so deploy would never run
      # and the site would keep serving the previous build. Ask for it explicitly;
      # a workflow_dispatch through the API is not suppressed. The dispatched run
      # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
      #
      # The filename below has to be the one THIS repo has. It is deploy.yml here
      # -- and now that this job lives IN deploy.yml, it dispatches the file it is
      # written in. Some labs have deploy-pages.yml or pages.yml; a wrong name
      # 404s only on the auto-merge path, only after the merge has already landed,
      # which is the same silent non-deploy this step exists to stop.
      - name: Deploy the merged result
        if: success()
        run: |
          if gh pr view "$PR_URL" --json state --jq .state | grep -q MERGED; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
